<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="940" viewBox="0 0 1500 940">
<defs><radialGradient id="bg" cx="50%" cy="0%" r="110%"><stop offset="0" stop-color="#1d0f45"/><stop offset="0.6" stop-color="#0d0724"/><stop offset="1" stop-color="#080418"/></radialGradient><filter id="glow" x="-10%" y="-10%" width="120%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><marker id="ah38e1ff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#38e1ff"/></marker><marker id="ah9b6bff" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#9b6bff"/></marker><marker id="ahff2fa8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 z" fill="#ff2fa8"/></marker></defs>
<rect width="1500" height="940" fill="url(#bg)"/>
<text x="48" y="72" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="800" fill="#ffffff" text-anchor="start">One card, from task to seal</text>
<rect x="48" y="88" width="64" height="4" rx="2" fill="#ff2fa8" fill-opacity="1" stroke="#ff2fa8" stroke-width="0"/>
<text x="48" y="126" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#c4b2e6" text-anchor="start">Every step is a CLI command (or the matching MCP tool). Evidence is only good for the commit it was made on.</text>
<rect x="40" y="190" width="330" height="150" rx="14" fill="#150b33" fill-opacity="1" stroke="#ff2fa8" stroke-width="2" filter="url(#glow)"/>
<text x="62" y="232" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start">1  Create &amp; claim</text>
<text x="62" y="268" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#7ff0ff" text-anchor="start">task add · task claim</text>
<text x="62" y="296" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c4b2e6" text-anchor="start">global id T-0001</text>
<rect x="410" y="190" width="330" height="150" rx="14" fill="#150b33" fill-opacity="1" stroke="#ff2fa8" stroke-width="2" filter="url(#glow)"/>
<text x="432" y="232" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start">2  Bind one PR</text>
<text x="432" y="268" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#7ff0ff" text-anchor="start">pr link T-0001 --pr o/r#12</text>
<text x="432" y="296" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c4b2e6" text-anchor="start">second PR is refused</text>
<rect x="780" y="190" width="330" height="150" rx="14" fill="#150b33" fill-opacity="1" stroke="#38e1ff" stroke-width="2" filter="url(#glow)"/>
<text x="802" y="232" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start">3  Poll GitHub</text>
<text x="802" y="268" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#7ff0ff" text-anchor="start">shuin poll</text>
<text x="802" y="296" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c4b2e6" text-anchor="start">caches head, review, CI</text>
<rect x="1150" y="190" width="330" height="150" rx="14" fill="#150b33" fill-opacity="1" stroke="#ff2fa8" stroke-width="2" filter="url(#glow)"/>
<text x="1172" y="232" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start">4  Request review</text>
<text x="1172" y="268" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#7ff0ff" text-anchor="start">review request --tried</text>
<text x="1172" y="296" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c4b2e6" text-anchor="start">“tried and failed” line required</text>
<rect x="40" y="440" width="330" height="150" rx="14" fill="#150b33" fill-opacity="1" stroke="#ff2fa8" stroke-width="2" filter="url(#glow)"/>
<text x="62" y="482" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start">5  Attach evidence</text>
<text x="62" y="518" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#7ff0ff" text-anchor="start">evidence add --commit-sha</text>
<text x="62" y="546" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c4b2e6" text-anchor="start">screenshot · film · logs</text>
<rect x="410" y="440" width="330" height="150" rx="14" fill="#150b33" fill-opacity="1" stroke="#38e1ff" stroke-width="2" filter="url(#glow)"/>
<text x="432" y="482" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start">6  Verification queue</text>
<text x="432" y="518" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#7ff0ff" text-anchor="start">queue enqueue → claim</text>
<text x="432" y="546" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c4b2e6" text-anchor="start">30-minute lease + heartbeat</text>
<rect x="780" y="440" width="330" height="150" rx="14" fill="#150b33" fill-opacity="1" stroke="#38e1ff" stroke-width="2" filter="url(#glow)"/>
<text x="802" y="482" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start">7  Verifier stamps</text>
<text x="802" y="518" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#7ff0ff" text-anchor="start">shuin stamp --id N</text>
<text x="802" y="546" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c4b2e6" text-anchor="start">fails if the lease expired</text>
<rect x="1150" y="440" width="330" height="150" rx="14" fill="#150b33" fill-opacity="1" stroke="#9b6bff" stroke-width="2" filter="url(#glow)"/>
<text x="1172" y="482" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="700" fill="#ffffff" text-anchor="start">8  Seal the PR</text>
<text x="1172" y="518" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="18" font-weight="400" fill="#7ff0ff" text-anchor="start">shuin seal --pr o/r#12</text>
<text x="1172" y="546" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c4b2e6" text-anchor="start">fail-closed gate + receipt</text>
<path d="M370 265 L406 265" fill="none" stroke="#ff2fa8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahff2fa8)"/>
<path d="M370 515 L406 515" fill="none" stroke="#ff2fa8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahff2fa8)"/>
<path d="M740 265 L776 265" fill="none" stroke="#ff2fa8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahff2fa8)"/>
<path d="M740 515 L776 515" fill="none" stroke="#ff2fa8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahff2fa8)"/>
<path d="M1110 265 L1146 265" fill="none" stroke="#ff2fa8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahff2fa8)"/>
<path d="M1110 515 L1146 515" fill="none" stroke="#ff2fa8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahff2fa8)"/>
<path d="M1315 340 L1315 385 L205 385 L205 436" fill="none" stroke="#ff2fa8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ahff2fa8)"/>
<rect x="40" y="660" width="560" height="240" rx="14" fill="#150b33" fill-opacity="1" stroke="#38e1ff" stroke-width="2" stroke-dasharray="8 6" filter="url(#glow)"/>
<text x="62" y="702" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="start">If the PR head moves</text>
<text x="62" y="740" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c4b2e6" text-anchor="start">Evidence for the old SHA goes stale.</text>
<text x="62" y="770" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c4b2e6" text-anchor="start">Queued or running verifications for it</text>
<text x="62" y="800" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c4b2e6" text-anchor="start">are superseded. Attach new evidence,</text>
<text x="62" y="830" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#c4b2e6" text-anchor="start">re-enqueue, verify again.</text>
<rect x="640" y="660" width="820" height="240" rx="14" fill="#150b33" fill-opacity="1" stroke="#9b6bff" stroke-width="2" filter="url(#glow)"/>
<text x="662" y="702" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="start">What  shuin seal  checks, in order</text>
<text x="664" y="744" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="700" fill="#38e1ff" text-anchor="start">1</text>
<text x="692" y="744" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#f6ecff" text-anchor="start">Read the PR head from GitHub</text>
<text x="664" y="778" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="700" fill="#38e1ff" text-anchor="start">2</text>
<text x="692" y="778" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#f6ecff" text-anchor="start">Required status checks for that exact SHA (zero = “missing”)</text>
<text x="664" y="812" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="700" fill="#38e1ff" text-anchor="start">3</text>
<text x="692" y="812" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#f6ecff" text-anchor="start">A verifier pass recorded on the same SHA</text>
<text x="664" y="846" font-family="'JetBrains Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="19" font-weight="700" fill="#38e1ff" text-anchor="start">4</text>
<text x="692" y="846" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#f6ecff" text-anchor="start">Read the head again, then store the receipt</text>
<text x="662" y="876" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ff2fa8" text-anchor="start">Any read failure is a refusal.</text>
<path d="M205 590 L205 656" fill="none" stroke="#38e1ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 6" marker-end="url(#ah38e1ff)"/>
<path d="M1315 590 L1315 656" fill="none" stroke="#9b6bff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ah9b6bff)"/>
</svg>
