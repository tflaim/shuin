<rect x="48" y="88" width="64" height="4" rx="2" fill="#ff2fa8" fill-opacity="1" stroke="#ff2fa8" stroke-width="0"/>
<text x="48" y="126" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#c4b2e6" text-anchor="start">One SQLite file on your machine. GitHub stays the source of truth.</text>
<text x="40" y="168" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#38e1ff" text-anchor="start" letter-spacing="2">AGENTS</text>
