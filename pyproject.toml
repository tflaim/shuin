[project]
name = "shuin"
version = "0.1.0"
description = "Local-first ledger for a lead and a human to coordinate coding agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
shuin = "shuin.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["shuin*"]

[tool.setuptools.package-data]
shuin = ["schema.sql", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
